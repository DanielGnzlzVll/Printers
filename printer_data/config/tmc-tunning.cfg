[auto_speed]


################################################################################
## TMC Auto Tune
################################################################################
[motor_constants siboor-42sth48-2504(s45)]
#Siboor BOM Voron Trident AWD
resistance: 0.9
inductance: 0.0016
holding_torque: 0.6
max_current: 2               # Was 2.5
steps_per_revolution: 200

[autotune_tmc stepper_x]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent

[autotune_tmc stepper_y]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent

[autotune_tmc stepper_x1]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent

[autotune_tmc stepper_y1]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent


################################################################################
##                                 Motor Sync
## https://github.com/MRX8024/motors-sync/blob/main/wiki/EN.md
################################################################################


################################################################################
##                                Motor Sync Config
################################################################################
[motors_sync]
axes: x,y
accel_chip: adxl345
microsteps: 32
max_step_size: 16
retry_tolerance: 1500
retries: 5


[gcode_macro SYNC_MOTORS]
rename_existing: SYNC_MOTORS_BASE
gcode:
    {% if not printer.motors_sync.applied %}
      {% set fans = ["hotend_fan", "fan0", "fan2"] %}
      {% set prev_speeds = {} %}
      
      # Store current speeds
      {% for f in fans %}
        {% set _ = prev_speeds.update({f: printer[f].speed|float}) %}
      {% endfor %}
      
      # Turn off all fans
      {% for f in fans %}
        SET_FAN_SPEED FAN={f} SPEED=0
      {% endfor %}
      
      SYNC_MOTORS_BASE FORCE_RUN=1
      
      # Restore previous speeds
      {% for f in fans %}
        SET_FAN_SPEED FAN={f} SPEED={prev_speeds[f]}
      {% endfor %}
    {% endif %}