[auto_speed]


################################################################################
## TMC Auto Tune
################################################################################
[motor_constants siboor-42sth48-2504(s45)]
#Siboor BOM Voron Trident AWD
resistance: 0.9
inductance: 0.0016
holding_torque: 0.6
max_current: 2               # Was 2.5
steps_per_revolution: 200

[autotune_tmc stepper_x]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent

[autotune_tmc stepper_y]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent

[autotune_tmc stepper_x1]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent

[autotune_tmc stepper_y1]
motor: siboor-42sth48-2504(s45)
# tuning_goal: silent


################################################################################
##                                 Motor Sync
## https://github.com/MRX8024/motors-sync/blob/main/wiki/EN.md
################################################################################


################################################################################
##                                Motor Sync Config
################################################################################
[motors_sync]
axes: x,y
accel_chip_x: adxl345 carto
accel_chip_y: adxl345 carto
microsteps: 32
max_step_size: 16
retry_tolerance: 1500
retries: 5
head_fan: hotend_fan,fan0,fan2


[gcode_macro motor_sync]
gcode:
    SYNC_MOTORS FORCE_RUN=1