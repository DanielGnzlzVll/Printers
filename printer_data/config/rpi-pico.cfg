########################################
# MCU - Raspberry Pi Pico (RP2040)
########################################

[mcu rpi-pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044466888892F1C-if00


# ====== I2C en Pico (GP0=SDA, GP1=SCL) ======

[temperature_sensor chamber]
sensor_type: SHT3X
i2c_software_scl_pin: rpi-pico:gpio1
i2c_software_sda_pin: rpi-pico:gpio0
i2c_address: 68
min_temp: 0
max_temp: 100

[temperature_sensor electronics]
sensor_type: SHT3X
i2c_software_scl_pin: rpi-pico:gpio1
i2c_software_sda_pin: rpi-pico:gpio0
i2c_address: 69
min_temp: 0
max_temp: 100